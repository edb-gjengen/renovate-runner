name: Renovate

on:
  schedule:
    # Every 4 hours from 09 to 21 UTC: 10-22 in Oslo in winter, 11-23 in summer. Each
    # repository's renovate.json decides when PRs open; a run refreshes its dependency
    # dashboard and opens the PRs approved there.
    - cron: "17 9-21/4 * * *"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    container: ghcr.io/renovatebot/renovate:44
    steps:
      - name: Run Renovate
        env:
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: https://git.neuf.no/api/v1
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_GIT_AUTHOR: Renovate <renovate@neuf.no>
          # Every edb repository the renovate account can write to
          RENOVATE_AUTODISCOVER: "true"
          RENOVATE_AUTODISCOVER_FILTER: edb/*
          # Raises the GitHub API rate limit for release notes and github-tags lookups
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
          LOG_LEVEL: info
        run: renovate
